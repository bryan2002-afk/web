<!DOCTYPE html>
<html lang="es" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Web</title>

  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="img/share.ico" type="image/x-icon">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#E94074',
              pinkHover: '#d83365',
              teal: '#4CD9AC',
              bgDark: '#0d1117',
              cardDark: '#121214',
              sheetDark: '#1a1a1e'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Font Awesome 6.7.2 -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script defer src="script.js"></script>


</head>

<body class="font-sans bg-[#dcebe6] dark:bg-brand-bgDark text-gray-800 dark:text-gray-100 flex items-center justify-center p-3 sm:p-6">

  <!-- Notificaciones Toast -->
  <div id="toast"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden max-w-[90%]">

    <div class="bg-gray-900 text-white dark:bg-white dark:text-gray-900 px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-medium whitespace-nowrap">

      <i id="toast-icon" class="fa-solid fa-circle-info text-pink-500"></i>

      <span id="toast-message">Notificación</span>
    </div>
  </div>

  <main class="w-full max-w-md mx-auto">

    <!-- Tarjeta principal -->
    <div class="bg-white dark:bg-brand-cardDark rounded-[32px] shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-800/60">

      <!-- ============================== -->
      <!-- PERFIL DE USUARIO              -->
      <!-- ============================== -->

      <div class="relative">

        <!-- Portada -->
        <div class="cover-photo relative">

          <!-- Botón volver -->
          <button
            type="button"
            onclick="showToast('Regresando al menú principal', 'fa-arrow-left')"
            class="absolute top-4 left-4 w-10 h-10 rounded-full bg-black/40 hover:bg-black/60 text-white flex items-center justify-center backdrop-blur-sm"
            aria-label="Volver">

            <i class="fa-solid fa-chevron-left"></i>
          </button>

          
          <!-- Botón para compartir el enlace del perfil -->
          <button
            type="button"
            id="shareBtn"
            class="icon-btn"
            aria-label="Copiar enlace del perfil"
            title="Copiar enlace del perfil">

            <i class="fa-solid fa-link" aria-hidden="true"></i>
          </button>

          

        </div>

        <!-- Información del perfil -->
        <div class="relative flex flex-col items-center text-center px-6 pb-6">

          <!-- Avatar -->
          <div class="relative -mt-14 mb-3 group">

            <img
              src="img/perfil.jpg"
              alt="Foto de perfil de Jon Möller"
              class="profile-avatar shadow-xl group-hover:scale-105"
              onerror="this.onerror=null;this.src='https://placehold.co/120x120/E94074/ffffff?text=JM';"
            >

            <!-- Indicador de conexión -->
            <span class="absolute bottom-2 right-1 w-5 h-5 rounded-full bg-emerald-500 border-4 border-[#121214]"></span>
          </div>

          <!-- Nombre -->
          <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
            Bryan Suriano
            <i class="fa-solid fa-circle-check verified-badge" title="Verified Account"></i>
          </h1>

          <!-- Ubicación 
          <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mt-2 flex items-center justify-center gap-1">

            <i class="fa-solid fa-location-dot text-[11px]"></i>

            Stockholm, Sweden
          </p>-->

          <!-- Profesión -->
          <p class="text-sm font-semibold text-gray-700 dark:text-gray-300 mt-2" style="font-size: 0.95rem; font-weight: 500; color: #a78bfa;">
            @bryan2002-afk
          </p>

          <!-- Botón PRO 
          <button
            type="button"
            onclick="showToast('¡Redirigiendo a suscripción PRO!', 'fa-crown')"
            class="mt-5 w-full bg-brand-pink hover:bg-brand-pinkHover active:scale-[0.98] text-white font-semibold py-3 px-6 rounded-full shadow-lg shadow-pink-500/25 text-sm tracking-wide">

            <i class="fa-solid fa-crown mr-2"></i>

            Upgrade Now - Go Pro
          </button>
        -->

        </div>
      </div>

      <!-- ============================== -->
      <!-- CONFIGURACIÓN Y REDES SOCIALES -->
      <!-- ============================== -->

      <section class="bg-gray-50 dark:bg-brand-sheetDark rounded-t-[28px] p-5 sm:p-6 pt-7 space-y-2 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.05)]">


        

        <!-- ============================== -->
        <!-- REDES SOCIALES                 -->
        <!-- ============================== -->

        <div class="px-2 pt-1">

          <h3 class="text-lg font-bold text-gray-900 dark:text-white">
            Redes sociales
          </h3>

          <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
            Encuéntrame en mis redes sociales.
          </p>
        </div>

        <!-- Iconos de redes sociales -->
        <div class="grid grid-cols-4 gap-y-5 gap-x-3 py-4">

          <!-- Facebook -->
          <div class="flex flex-col items-center gap-2">

            <a
              href="https://www.facebook.com/share/19o6HypsCa/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook"
              title="Facebook"
              class="social-icon bg-[#1877F2] hover:bg-[#0d65d9]">

              <i class="fa-brands fa-facebook-f"></i>
            </a>

            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
              Facebook
            </span>
          </div>

          <!-- Instagram -->
          <div class="flex flex-col items-center gap-2">

            <a
              href="https://www.instagram.com/bryan_suriano/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
              title="Instagram"
              class="social-icon bg-gradient-to-br from-purple-600 via-pink-500 to-orange-400">

              <i class="fa-brands fa-instagram"></i>
            </a>

            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
              Instagram
            </span>
          </div>

          <!-- WhatsApp -->
          <div class="flex flex-col items-center gap-2">

            <a
              href="https://wa.me/529514650437?text=Hola%20Bryan%2C%20vi%20tu%20perfil"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="WhatsApp"
              title="WhatsApp"
              class="social-icon bg-[#25D366] hover:bg-[#1da851]">

              <i class="fa-brands fa-whatsapp"></i>
            </a>

            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
              WhatsApp
            </span>
          </div>
          
          <!-- TikTok -->
          <div class="flex flex-col items-center gap-2">

            <a
              href="https://www.tiktok.com/@2_bryan.s"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="TikTok"
              title="TikTok"
              class="social-icon bg-black hover:bg-gray-800 border border-gray-600">

              <i class="fa-brands fa-tiktok"></i>

            </a>

            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
              TikTok
            </span>

          </div>

          <!-- Telegram -->
          <div class="flex flex-col items-center gap-2">

            <a
              href="https://t.me/bryan_S_01"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Telegram"
              title="Telegram"
              class="social-icon bg-[#0088cc] hover:bg-[#006da3]">

              <i class="fa-brands fa-telegram"></i>

            </a>

            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
              Telegram
            </span>

          </div>

          <!-- Threads: SVG independiente de Font Awesome -->
          <div class="flex flex-col items-center gap-2">

            <a
              href="https://www.threads.com/@bryan_suriano"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Threads"
              title="Threads"
              class="social-icon bg-black hover:bg-gray-800 border border-gray-600">

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="currentColor"
                aria-hidden="true">

                <path d="M12.186 24h-.007c-3.581-.024-6.328-1.205-8.163-3.51C2.382 18.447 1.5 15.59 1.5 12c0-3.59.882-6.447 2.516-8.49C5.85 1.205 8.598.024 12.179 0h.014c2.75.018 5.028.78 6.77 2.266 1.63 1.39 2.664 3.4 3.073 5.973l-2.28.362c-.337-2.116-1.138-3.73-2.38-4.79-1.325-1.13-3.073-1.71-5.197-1.725-2.856.02-5.006.92-6.392 2.66C4.487 6.31 3.8 8.75 3.8 12c0 3.25.687 5.69 1.987 7.254 1.386 1.74 3.536 2.64 6.392 2.66 2.57-.018 4.38-.704 5.686-2.16 1.49-1.66 1.52-3.69.99-4.93-.31-.73-.87-1.3-1.66-1.72-.19 1.45-.64 2.59-1.35 3.42-.91 1.07-2.22 1.63-3.9 1.65-1.27.01-2.43-.37-3.26-1.07-.86-.73-1.34-1.77-1.36-2.92-.04-2.26 1.75-3.9 4.46-4.08 1.03-.07 2.01.01 2.92.23-.12-.64-.36-1.16-.72-1.55-.52-.57-1.3-.87-2.31-.88h-.03c-.81 0-1.91.22-2.61 1.26l-1.9-1.3c.95-1.41 2.55-2.2 4.51-2.2h.05c3.2.02 5.18 1.97 5.48 5.34.17.07.34.15.5.23 1.53.78 2.65 1.96 3.24 3.38.91 2.18.7 5.36-1.45 7.76C17.73 23.07 15.35 23.98 12.186 24zm.13-11.61c-.2 0-.4.006-.61.02-1.17.08-2.55.61-2.53 1.77.02 1.02 1.14 1.45 2.2 1.44 1.01-.01 2.31-.41 2.55-3.08-.49-.1-1.03-.15-1.61-.15z"/>
              </svg>
            </a>

            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
              Threads
            </span>
          </div>

          <!-- LinkedIn -->
          <div class="flex flex-col items-center gap-2">

            <a
              href="https://www.linkedin.com/in/bryan-julian-suriano-ramirez-09578a273/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
              title="LinkedIn"
              class="social-icon bg-[#0A66C2] hover:bg-[#084f96]">

              <i class="fa-brands fa-linkedin-in"></i>
            </a>

            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
              LinkedIn
            </span>
          </div>

          <!-- Gmail -->
          <div class="flex flex-col items-center gap-2">

            <a
              href="https://mail.google.com/mail/?view=cm&fs=1&to=surianobryan38@gmail.com"
              aria-label="Enviar correo"
              title="Gmail"
              class="social-icon bg-[#EA4335] hover:bg-[#c5221f]">

              <i class="fa-solid fa-envelope"></i>
            </a>

            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
              Gmail
            </span>
          </div>

          <!-- GitHub -->
          <div class="flex flex-col items-center gap-2">

            <a
              href="https://github.com/bryan2002-afk"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
              title="GitHub"
              class="social-icon bg-[#24292e] hover:bg-[#3b4148]">

              <i class="fa-brands fa-github"></i>
            </a>

            <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
              GitHub
            </span>
          </div>

        </div>



        <!-- Separador -->
        <div class="border-t border-gray-200 dark:border-gray-700/70 my-5"></div>
        
        <!-- Título -->
        <h2 class="text-xl font-bold text-gray-900 dark:text-white px-2 mb-4">
          Settings
        </h2>

        <!-- ============================== -->
        <!-- ÚNICA CONFIGURACIÓN: TEMA       -->
        <!-- ============================== -->

        <div class="flex items-center justify-between p-2.5 rounded-2xl hover:bg-gray-200/60 dark:hover:bg-gray-800/40">

          <div class="flex items-center gap-3.5">

            <div class="w-9 h-9 rounded-full bg-black text-white flex items-center justify-center text-sm">

              <i id="modeIcon" class="fa-solid fa-moon"></i>
            </div>

            <div>
              <span class="font-bold text-sm text-gray-800 dark:text-gray-200">
                Dark Mode
              </span>

              <p id="modeDescription" class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
                Modo oscuro activado
              </p>
            </div>
          </div>

          <!-- Interruptor de tema -->
          <label class="relative inline-flex items-center cursor-pointer">

            <input
              type="checkbox"
              id="darkModeToggle"
              class="sr-only peer"
              checked
              aria-label="Activar o desactivar el modo oscuro">

            <div class="w-12 h-6 bg-gray-300 rounded-full peer-focus:outline-none peer dark:bg-gray-700 peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full">
            </div>

          </label>
        </div>

      </section>
    </div>

    <!-- Pie de página -->
    <p class="text-center text-xs font-medium text-gray-500 dark:text-gray-400 mt-4">
      Lnk Bio - Accounts
    </p>

  </main>

  
</body>
</html>
