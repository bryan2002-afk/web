
<!DOCTYPE html>

  <style>

    /* ==============================
       CONFIGURACIÓN GENERAL
    ============================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      /* Fondo negro */
      background: #000;

      color: white;

      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }


    /* ==============================
       TARJETA DEL PERFIL
    ============================== */

    .perfil {
      width: 100%;
      max-width: 400px;

      background: #111;

      border: 1px solid #292929;

      border-radius: 25px;

      padding: 35px 25px;

      text-align: center;

      box-shadow:
        0 0 30px rgba(255, 255, 255, 0.05);
    }


    /* ==============================
       FOTO DE PERFIL
    ============================== */

    .foto {
      width: 110px;
      height: 110px;

      border-radius: 50%;

      object-fit: cover;

      border: 3px solid white;

      margin-bottom: 15px;
    }


    /* ==============================
       NOMBRE
    ============================== */

    .nombre {
      font-size: 25px;
      font-weight: bold;

      margin-bottom: 5px;
    }


    /* Usuario */

    .usuario {
      color: #888;

      font-size: 15px;

      margin-bottom: 15px;
    }


    /* Descripción */

    .descripcion {
      color: #ccc;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 30px;
    }


    /* ==============================
       REDES SOCIALES
    ============================== */

    .redes {
      display: flex;

      justify-content: center;

      gap: 15px;

      flex-wrap: wrap;
    }


    .red {
      position: relative;

      width: 55px;
      height: 55px;

      border-radius: 50%;

      background: #1c1c1c;

      display: flex;

      align-items: center;
      justify-content: center;

      color: white;

      font-size: 22px;

      text-decoration: none;

      transition: 0.3s;
    }


    /* ==============================
       TOOLTIP
    ============================== */

    .tooltip {
      position: absolute;

      bottom: 65px;

      left: 50%;

      transform: translateX(-50%) translateY(10px);

      background: #222;

      color: white;

      font-size: 12px;

      padding: 6px 10px;

      border-radius: 8px;

      white-space: nowrap;

      opacity: 0;

      pointer-events: none;

      transition: 0.3s;
    }


    .tooltip::after {
      content: "";

      position: absolute;

      bottom: -5px;

      left: 50%;

      transform: translateX(-50%);

      border-left: 5px solid transparent;

      border-right: 5px solid transparent;

      border-top: 5px solid #222;
    }


    .red:hover .tooltip {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* ==============================
       COLORES DE LAS REDES
    ============================== */

    .facebook:hover {
      background: #1877F2;
    }

    .instagram:hover {
      background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );
    }

    .whatsapp:hover {
      background: #25D366;
    }

    .github:hover {
      background: #333;
    }

    .linkedin:hover {
      background: #0A66C2;
    }

    .twitter:hover {
      background: #1DA1F2;
    }

.gmail:hover {
  background: #EA4335;
}


    /* ==============================
       TEXTO INFERIOR
    ============================== */

    .footer {
      margin-top: 30px;

      font-size: 12px;

      color: #666;
    }

  </style>

</head>
